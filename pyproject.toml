[project]
name = "wharfinger-courier"
version = "0.1.0"
description = "Fetches RSS articles and compiles them into Kindle XHTML"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.33",
    "readability-lxml>=0.8",
    "trafilatura>=2.0",
    "jinja2>=3",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[project.scripts]
courier = "courier.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
